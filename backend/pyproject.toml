[project]
name = "ai-coach-backend"
version = "0.1.0"
description = "AI Coaching Agent for Gen AI Engineers — FastAPI + LangGraph text coaching loop"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Orchestration
    "langgraph>=0.2.50",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-core>=0.3",
    "psycopg[binary,pool]>=3.2",
    # LLM providers (all optional at runtime — fake provider is the default)
    "groq>=0.13",
    "openai>=1.54",
    "google-genai>=0.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
